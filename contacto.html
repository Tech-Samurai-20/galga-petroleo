<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="main" href="./index.html">
    <link rel="stylesheet" href="./style.css">
    <title>Contacto</title>
</head>
<body>
    
    <section id="contacto" class="section">
        <div class="container">
            <h2>Entre em Contacto Connosco</h2>
            <div class="contact-form">
                <form action="https://formspree.io/f/xgvzaagz" method="post">
                    <div class="form-group">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="mensagem">Mensagem:</label>
                        <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="button primary">Enviar Mensagem</button>
                    <button type="" class="button primary">Voltar    </button>
                </form>
            </div>
            <div class="contact-info">
                <h3>Informações de Contacto</h3>
                <p><i class="fas fa-map-marker-alt"></i> Rua do Matagal</p>
                <p><i class="fas fa-phone"></i> +351 9377 tira tira mete mete</p>
                <p><i class="fas fa-envelope"></i> galgapetroleo@gmail.com</p>
            </div>
        </div>
    </section>
    <script src="./form_script.js"></script>
</body>
</html>
